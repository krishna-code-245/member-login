<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Member Profile | FitVerse Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <main class="page">
        <section class="portal" aria-labelledby="profile-title">
            <p class="eyebrow">FITVERSE GYM</p>
            <h1 id="profile-title">{{ member.member_name }}</h1>
            <div class="notice">
                <h2>Membership Profile</h2>
                <p>Member ID: {{ member.member_id }}</p>
                <p>Membership: {{ member.membership_type }}</p>
                <p>Expiry Date: {{ member.expiry_date.strftime('%Y-%m-%d') }}</p>
                <p>Days Remaining: {{ days_left }}</p>
            </div>
            <a class="back-link" href="{{ url_for('home') }}">Back to member login</a>
        </section>
    </main>
    <script>
        const memberDetails = [
            ["Name", {{ member.member_name|tojson }}],
            ["Member ID", {{ member.member_id|tojson }}],
            ["Membership Type", {{ member.membership_type|tojson }}],
            ["Expiry Date", {{ member.expiry_date.strftime('%Y-%m-%d')|tojson }}],
            ["Days Remaining", {{ days_left|tojson }}]
        ];
        window.alert(memberDetails.map(([label, value]) => `${label}: ${value}`).join("\n"));
    </script>
</body>
</html>
