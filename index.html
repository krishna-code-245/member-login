<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111b">
    <meta name="description" content="FitVerse Gym membership portal.">
    <title>FitVerse Gym | Membership Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="page">
        <section class="portal" aria-labelledby="page-title">
            <p class="eyebrow">FITVERSE GYM</p>
            <h1 id="page-title">Your next level starts here.</h1>
            <p class="intro">
                Welcome to the FitVerse membership portal. We're glad you're part of the
                community.
            </p>

            <form class="login-form" action="https://member-login.onrender.com/member-login" method="POST">
                <label for="member-id">Membership ID</label>
                <input
                    id="member-id"
                    type="text"
                    name="member_id"
                    placeholder="Enter Membership ID"
                    required>
                <button type="submit" class="login-btn">View Profile</button>
            </form>

            <div class="notice">
                <h2>Member lookup</h2>
                <p>
                    Enter the membership ID provided by your gym to view its membership
                    details.
                </p>
            </div>

            <p class="footnote">Train strong. Stay consistent. Be FitVerse.</p>
        </section>
    </main>
</body>
</html>
